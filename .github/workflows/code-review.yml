name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR information
        run: |
          echo "Base SHA: ${{ github.event.pull_request.base.sha }}"
          echo "Head SHA: ${{ github.event.pull_request.head.sha }}"
          echo "PR Number: ${{ github.event.pull_request.number }}"

      - name: Read review rules and PR changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE_SHA:CODE_REVIEW.md" > /tmp/CODE_REVIEW.md

          git diff \
            --unified=80 \
            "$BASE_SHA" "$HEAD_SHA" \
            -- . \
            ':(exclude)CODE_REVIEW.md' \
            ':(exclude).github/workflows/code-review.yml' \
            > /tmp/pr-diff.txt

          echo "Review instructions:"
          wc -c /tmp/CODE_REVIEW.md

          echo "PR diff:"
          wc -c /tmp/pr-diff.txt

      - name: Run git show "$BASE_SHA:CODE_REVIEW.md"ni AI code review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const reviewRules = fs.readFileSync(
            "/tmp/CODE_REVIEW.md",
            "utf8"
          );

          let diff = fs.readFileSync(
            "/tmp/pr-diff.txt",
            "utf8"
          );

          // Prevent extremely large PRs from exceeding model limits.
          const MAX_DIFF_LENGTH = 120000;

          if (diff.length > MAX_DIFF_LENGTH) {
            diff =
              diff.substring(0, MAX_DIFF_LENGTH) +
              "\n\n[PR DIFF TRUNCATED]";
          }

          const prompt = `
          You are a senior software engineer and expert code reviewer.

          Your job is to review the Pull Request changes using the
          repository's CODE_REVIEW.md rules.

          ============================================================
          CODE REVIEW RULES
          ============================================================

          ${reviewRules}

          ============================================================
          PULL REQUEST DIFF
          ============================================================

          ${diff}

          ============================================================
          REVIEW REQUIREMENTS
          ============================================================

          Review ONLY the code shown in the Pull Request diff.

          Do not invent issues.

          Do not criticize code that was not changed unless the changed
          code directly introduces or depends on the problem.

          Focus on actionable issues.

          Pay special attention to:

          1. Correctness
          2. Bugs
          3. JavaScript quality
          4. Playwright test reliability
          5. Async/await and Promise handling
          6. Locators and test stability
          7. Assertions
          8. API testing
          9. Error handling
          10. Security
          11. Hard-coded credentials or secrets
          12. Duplicate code
          13. Maintainability
          14. Performance
          15. Flaky test risks

          Severity levels:

          CRITICAL
          HIGH
          MEDIUM
          LOW

          Only report a severity when there is a real actionable issue.

          For every issue provide:

          - Severity
          - File
          - Line
          - Problem
          - Why it matters
          - Recommended fix

          If the code is good, do NOT manufacture issues.

          At the end provide:

          ## Summary

          Critical: <number>
          High: <number>
          Medium: <number>
          Low: <number>

          ## Final Recommendation

          APPROVE

          or

          CHANGES REQUESTED

          If no actionable problems are found, say:

          No actionable issues found.
          `;

          async function callGemini(model) {
            const url =
              `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;

            const response = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": process.env.GEMINI_API_KEY
              },
              body: JSON.stringify({
                contents: [
                  {
                    parts: [
                      {
                        text: prompt
                      }
                    ]
                  }
                ],
                generationConfig: {
                  temperature: 0.1,
                  maxOutputTokens: 5000
                }
              })
            });

            const data = await response.json();

            if (!response.ok) {
              throw new Error(
                `Gemini API error ${response.status}: ${JSON.stringify(data)}`
              );
            }

            const text =
              data?.candidates?.[0]?.content?.parts
                ?.map(part => part.text || "")
                .join("")
                .trim();

            if (!text) {
              throw new Error(
                `Gemini returned no review text: ${JSON.stringify(data)}`
              );
            }

            return text;
          }

          async function main() {
            if (!process.env.GEMINI_API_KEY) {
              throw new Error(
                "GEMINI_API_KEY GitHub secret is not configured."
              );
            }

            /*
             * Start with Flash because it is suitable for the first
             * free-tier test and generally has more accessible quota.
             *
             * We can change this later to:
             * gemini-2.5-pro
             * if your project has usable Pro quota.
             */
            const model = "gemini-2.5-flash";

            console.log(`Using Gemini model: ${model}`);

            const review = await callGemini(model);

            fs.writeFileSync(
              "/tmp/review.txt",
              review
            );

            console.log("===== AI CODE REVIEW =====");
            console.log(review);
            console.log("==========================");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Post review to Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body-file /tmp/review.txt